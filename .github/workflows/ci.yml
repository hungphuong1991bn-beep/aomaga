name: CI (kiểm tra mỗi lần đẩy code)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NM: ${{ github.workspace }}/node_modules
      AMG_TEST_OUT: /tmp/amg-test-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Kiểm tra cấu hình, bảo mật, workflow
        run: npm run verify
      - name: Kiểm thử cầu nối native (Android)
        run: node docs/kiem-thu/native_bridge.js
      - name: Kiểm thử nghiệp vụ (toàn bộ bộ kiểm thử AOMAGA MES)
        run: npm test
      - name: Đóng gói thử thư mục www
        run: npm run prepare:www
      - name: Nhật ký kiểm thử (khi lỗi)
        if: failure()
        run: tail -n 40 "$AMG_TEST_OUT"/*.out || true
