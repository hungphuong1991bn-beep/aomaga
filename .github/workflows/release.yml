name: Build & Phát hành (Windows EXE + Android APK)

# Tạo tag vX.Y.Z (ví dụ v1.0.0) → tự kiểm thử, build EXE + APK, tạo GitHub Release và tải file lên.
# "Run workflow" thủ công: chỉ build và lưu file ở mục Artifacts để thử, KHÔNG tạo Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Kiểm tra & kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    env:
      NM: ${{ github.workspace }}/node_modules
      AMG_TEST_OUT: /tmp/amg-test-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Xác định số phiên bản
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag phải dạng vX.Y.Z (nhận được: $GITHUB_REF_NAME)"; exit 1; }
          CODE="$(node -e "const [a,b,c]='$VERSION'.split('.').map(Number);console.log(a*1000000+b*1000+c)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Tag phải có mục trong CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^## \[${{ steps.v.outputs.version }}\]" CHANGELOG.md || { echo "::error::Thiếu mục ## [${{ steps.v.outputs.version }}] trong CHANGELOG.md"; exit 1; }
      - run: npm run verify
      - run: node docs/kiem-thu/native_bridge.js
      - run: npm test
      - name: Nhật ký kiểm thử (khi lỗi)
        if: failure()
        run: tail -n 40 "$AMG_TEST_OUT"/*.out || true

  windows:
    name: Build Windows EXE
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Gắn số phiên bản
        run: npm version "${{ needs.verify.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run prepare:www
      - name: Build bộ cài NSIS x64
        env:
          # Ký số (tuỳ chọn): đặt 2 Secret CSC_LINK (chứng thư .pfx dạng base64 hoặc URL) và CSC_KEY_PASSWORD. Không đặt → bộ cài KHÔNG ký.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never "-c.publish.owner=${{ github.repository_owner }}" "-c.publish.repo=${{ github.event.repository.name }}"
      - name: Kiểm tra file đầu ra
        shell: pwsh
        run: |
          $exe = Get-Item dist/AOMAGA-MES-Setup-x64.exe
          if ($exe.Length -lt 30MB) { throw "Bộ cài nhỏ bất thường: $($exe.Length) byte" }
          foreach ($f in 'dist/latest.yml','dist/AOMAGA-MES-Setup-x64.exe.blockmap') { if (-not (Test-Path $f)) { throw "Thiếu $f" } }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Chữ ký số: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { Write-Host "::warning::Bộ cài CHƯA ký số — Windows SmartScreen sẽ cảnh báo khi cài." }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/AOMAGA-MES-Setup-x64.exe
            dist/AOMAGA-MES-Setup-x64.exe.blockmap
            dist/latest.yml

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run prepare:www
      - name: Đồng bộ web vào dự án Android
        run: npx cap sync android
      - name: Chế độ ký APK
        id: mode
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::Chưa có Secret ANDROID_KEYSTORE_BASE64 → build APK DEBUG thử nghiệm (không dùng để phát hành chính thức)."; fi
      - name: Giải mã keystore (chỉ khi có Secret)
        if: steps.mode.outputs.signed == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aomaga.jks"
          echo "AMG_KEYSTORE_FILE=$RUNNER_TEMP/aomaga.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          AMG_VERSION_NAME: ${{ needs.verify.outputs.version }}
          AMG_VERSION_CODE: ${{ needs.verify.outputs.code }}
          AMG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AMG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AMG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: Đặt tên và kiểm tra APK
        run: |
          mkdir -p out
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then SRC=android/app/build/outputs/apk/release/app-release.apk; DST=out/AOMAGA-MES-Android.apk; else SRC=android/app/build/outputs/apk/debug/app-debug.apk; DST=out/AOMAGA-MES-Android-DEBUG.apk; fi
          test -f "$SRC" || { echo "::error::Không thấy $SRC"; exit 1; }
          cp "$SRC" "$DST"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt" dump badging "$DST" | grep -E "^package: name='vn\.aomaga\.mes'" || { echo "::error::Sai mã gói Android"; exit 1; }
          "$BT/aapt" dump badging "$DST" | grep -E "versionName='${{ needs.verify.outputs.version }}'" || { echo "::error::Sai versionName"; exit 1; }
          "$BT/apksigner" verify --verbose "$DST" | head -5
          [ "$(stat -c%s "$DST")" -gt 1000000 ] || { echo "::error::APK nhỏ bất thường"; exit 1; }
          sha256sum "$DST"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: out/*.apk

  release:
    name: Tạo GitHub Release
    needs: [verify, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Kiểm tra đủ file
        run: |
          find artifacts -type f | sort
          test -f artifacts/windows/AOMAGA-MES-Setup-x64.exe
          test -f artifacts/windows/latest.yml
          ls artifacts/android/*.apk
      - name: Soạn nội dung Release từ CHANGELOG
        env:
          AMG_UNSIGNED_APK: ${{ needs.android.outputs.signed == 'true' && '0' || '1' }}
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: AOMAGA MES ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/windows/AOMAGA-MES-Setup-x64.exe
            artifacts/windows/AOMAGA-MES-Setup-x64.exe.blockmap
            artifacts/windows/latest.yml
            artifacts/android/*.apk
          fail_on_unmatched_files: true
